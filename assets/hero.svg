<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="titolo descrizione">
<title id="titolo">SistemiLab: una rete di oggetti del calcolatore</title>
<desc id="descrizione">Un cristallo per il bit, un processore, banchi di memoria, una porta di ingresso e uscita, processi collegati, una cartella e un archivio circondano il nucleo del laboratorio.</desc>
<defs>
  <linearGradient id="oro" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#f2bd59" stop-opacity=".45"/><stop offset=".5" stop-color="#785b28" stop-opacity=".3"/><stop offset="1" stop-color="#10100e"/></linearGradient>
  <linearGradient id="superficie" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4d4533"/><stop offset="1" stop-color="#191912"/></linearGradient>
  <linearGradient id="ciano" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cd4da" stop-opacity=".72"/><stop offset="1" stop-color="#1f4448" stop-opacity=".45"/></linearGradient>
  <radialGradient id="alone"><stop stop-color="#f2bd59" stop-opacity=".12"/><stop offset="1" stop-color="#f2bd59" stop-opacity="0"/></radialGradient>
  <radialGradient id="nucleo"><stop stop-color="#f4efdf"/><stop offset=".24" stop-color="#f2bd59"/><stop offset="1" stop-color="#f2bd59" stop-opacity="0"/></radialGradient>
  <pattern id="reticolo" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 0H28V28" fill="none" stroke="#6b604b" stroke-opacity=".09"/><circle cx="0" cy="0" r=".7" fill="#a89c80" fill-opacity=".21"/></pattern>
  <marker id="direzione" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#bba371" stroke-width="1.2"/></marker>
</defs>
<style>
.label{font:13px ui-monospace,monospace;letter-spacing:1.5px;fill:#f4efdf}.micro{font:9px ui-monospace,monospace;letter-spacing:1.6px;fill:#b7ab8f}.line{fill:none;stroke:#6b604b;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}.edge{fill:none;stroke:#f2bd59;stroke-width:1.15;stroke-linejoin:round}.wire{fill:none;stroke:#f2bd59;stroke-width:.8;stroke-opacity:.65}.flow{fill:none;stroke:#f2bd59;stroke-width:2;stroke-linecap:round;stroke-dasharray:3 220;animation:flow 7s linear infinite}.flow.cyan{stroke:#8cd4da;animation-delay:-2s}.breath{animation:breath 5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-223}}@keyframes breath{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none;stroke-width:.65;opacity:.55}.breath{animation:none}}
</style>
<!-- A faint plane holds the symbols without enclosing them in identical badges. -->
<path d="M26 54H586L614 82V356L586 384H54L26 356Z" fill="url(#reticolo)"/>
<path d="M27 88V54H61m520 0h32v34M27 349v34h34m520 0h32v-34" class="line" opacity=".5"/>
<path d="M68 196 178 86M409 393 581 221M192 384 415 161" class="line" opacity=".15"/>
<ellipse cx="322" cy="216" rx="148" ry="135" fill="url(#alone)"/>
<text x="28" y="25" class="micro">SISTEMILAB / RETE DEI CONCETTI</text>
<text x="612" y="414" text-anchor="end" class="micro">DAL BIT AL SISTEMA</text>
<!-- Directed signal paths use the same geometry as their animated pulses. -->
<g class="line" marker-end="url(#direzione)">
  <path d="M125 113H174L230 169H278"/>
  <path d="M320 107V157"/>
  <path d="M493 145H454L412 187H366"/>
  <path d="M126 296H183L238 241H278"/>
  <path d="M322 259V305"/>
  <path d="M367 233H411L466 288H496"/>
</g>
<path d="M125 113H174L230 169H278" class="flow cyan"/>
<path d="M320 107V157" class="flow" style="animation-delay:-4s"/>
<path d="M493 145H454L412 187H366" class="flow" style="animation-delay:-1s"/>
<path d="M126 296H183L238 241H278" class="flow cyan" style="animation-delay:-5s"/>
<path d="M322 259V305" class="flow" style="animation-delay:-2.8s"/>
<path d="M367 233H411L466 288H496" class="flow" style="animation-delay:-5.6s"/>
<g fill="#10100e" stroke="#ad9563" stroke-width=".8"><path d="m192 131 3-3 3 3-3 3Z"/><path d="m444 155 3-3 3 3-3 3Z"/><path d="m204 276 3-3 3 3-3 3Z"/><path d="m443 265 3-3 3 3-3 3Z"/></g>
<!-- Bit: a luminous, faceted crystal. -->
<g transform="translate(99 92)">
  <ellipse cy="42" rx="33" ry="7" fill="#000" opacity=".35"/>
  <path d="M0-35 25-12 18 20 0 38-18 20-25-12Z" fill="url(#ciano)" stroke="#8cd4da" stroke-width="1.2"/>
  <path d="M0-35-5-5-18 20 0 38 6 2 25-12Z" fill="#8cd4da" fill-opacity=".12"/>
  <path d="M0-35-5-5 25-12M-25-12-5-5 6 2 18 20M-18 20 6 2 0 38M-5-5 0 38" fill="none" stroke="#b0e4e7" stroke-width=".8"/>
  <circle cx="-5" cy="-5" r="2.3" fill="#e6ffff"/>
  <text y="64" text-anchor="middle" class="label">BIT</text>
  <text y="79" text-anchor="middle" class="micro">0 / 1</text>
</g>
<!-- CPU: chamfered package, top die and angled contacts. -->
<g transform="translate(320 68)">
  <ellipse cy="35" rx="49" ry="10" fill="#000" opacity=".3"/>
  <g stroke="#9d844d" stroke-width="2"><path d="M-42-4-52 1m16 1-10 5m16 1-10 5m16 1-10 5M42-4 52 1m-16 1 10 5m-16 1 10 5m-16 1 10 5M-25-23v-9m12 3v-9m12 3v-9m12 15v-9m12 15v-9M-24 24v10m12-4v10m12-4v10m12-16v10m12-16v10"/></g>
  <path d="M-39-7 0-28 39-7V8L0 31-39 8Z" fill="#2b2415" stroke="#ad8b49"/>
  <path d="M-39-7 0 15 39-7 0-28Z" fill="url(#oro)" stroke="#f2bd59" stroke-width="1.2"/>
  <path d="M0 15V31M-29-7 0-22 29-7 0 9Z" class="wire"/>
  <path d="M-17-8 0-17 17-8V-1L0 9-17-1Z" fill="#13130e" stroke="#f2bd59"/>
  <path d="M-17-8 0 1 17-8M0 1V9" class="wire"/>
  <path d="M-10-8 0-13 10-8 0-3Z" fill="#f2bd59" fill-opacity=".5"/>
  <text x="69" y="0" class="label">CPU</text>
</g>
<!-- Memory: three recognisable banks, with one selected cell. -->
<g transform="translate(529 112)">
 <ellipse cy="46" rx="46" ry="8" fill="#000" opacity=".32"/>
 <g stroke="#a48c58" stroke-width="1">
  <path d="M-39 12 23-5 40 4V21L-22 38-39 29Z" fill="#231f14"/>
  <path d="M-39 12-22 22 40 4M-22 22V38" fill="none"/>
  <path d="M-39-2 23-19 40-10V7L-22 24-39 15Z" fill="#302819"/>
  <path d="M-39-2-22 8 40-10M-22 8V24" fill="none"/>
  <path d="M-39-16 23-33 40-24V-7L-22 10-39 1Z" fill="url(#superficie)"/>
 </g>
 <path d="M-39-16-22-6 40-24M-22-6V10" class="edge"/>
 <g fill="#161811" stroke="#b59a60" stroke-width=".8"><path d="M-22-17-12-20-2-15-12-12Z"/><path d="M-6-21 4-24 14-19 4-16Z"/><path d="M10-25 20-28 30-23 20-20Z"/></g>
 <path d="M-6-21 4-24 14-19 4-16Z" fill="#f2bd59" fill-opacity=".75"/>
 <path d="m-16 0 9-2m5-1 9-2m5-1 9-2m5-1 7-2" stroke="#c2a36b" stroke-width="2"/>
 <text y="65" text-anchor="middle" class="label">MEMORIA</text>
</g>
<!-- Core: open reticular polyhedron with a radiant central point. -->
<g transform="translate(322 210)">
 <path d="M0-53 47-27 47 27 0 53-47 27-47-27Z" fill="#10100e" fill-opacity=".8" stroke="#6b604b" stroke-width=".8"/>
 <path d="M0-45 39-22 39 22 0 45-39 22-39-22Z" fill="url(#oro)" stroke="#f2bd59" stroke-width="1.15"/>
 <g class="wire"><path d="M0-45 20 0 0 45-20 0ZM-39-22 20 0-39 22 0-45 39 22-20 0 39-22 0 45Z"/><path d="M-39-22 39 22M39-22-39 22"/></g>
 <circle r="20" fill="url(#nucleo)" class="breath"/>
 <circle r="3" fill="#f4efdf"/>
 <rect x="-57" y="-1" width="114" height="27" fill="#12120f" fill-opacity=".93"/>
 <text y="16" text-anchor="middle" class="label" style="font-size:14px;letter-spacing:1px">SISTEMILAB</text>
 <path d="M-29 34H29" class="wire"/>
</g>
<!-- I/O: a physical aperture with independently directed arrows. -->
<g transform="translate(98 292)">
 <ellipse cy="37" rx="43" ry="7" fill="#000" opacity=".3"/>
 <path d="M-26-28 17-39 31-30V25L-12 36-26 27Z" fill="url(#superficie)" stroke="#8f815d"/>
 <path d="M-26-28-12-19 31-30M-12-19V36" class="line"/>
 <path d="M-5-12 23-20V19L-5 27Z" fill="#10100e" stroke="#f2bd59"/>
 <path d="M-45-3H7m-7-7L10-3 0 5" fill="none" stroke="#8cd4da" stroke-width="2"/>
 <path d="M44 14H-1m8-8-10 8 10 8" fill="none" stroke="#f2bd59" stroke-width="2"/>
 <text y="62" text-anchor="middle" class="label">I/O</text>
</g>
<!-- Processes: independent nuclei, one shared crossing and orbital traces. -->
<g transform="translate(322 350)">
 <ellipse rx="55" ry="25" transform="rotate(-18)" fill="none" stroke="#6b604b" stroke-width=".8"/>
 <path d="M-36 13-15-17 33 7M-36 13 33 7" class="line"/>
 <g fill="url(#oro)" stroke="#f2bd59" stroke-width="1"><path d="m-15-30 12 7v14L-15-2-27-9v-14Z"/><path d="m-36 2 11 6v12l-11 6-11-6V8Z"/><path d="m33-4 11 6v12l-11 6-11-6V2Z"/></g>
 <g fill="#f4efdf"><circle cx="-15" cy="-16" r="2.7"/><circle cx="-36" cy="14" r="2"/><circle cx="33" cy="8" r="2"/></g>
 <circle cx="5" cy="-23" r="2" fill="#8cd4da"/>
 <text y="50" text-anchor="middle" class="label">PROCESSI</text>
</g>
<!-- Filesystem: a folder and a storage cylinder share a directed connection. -->
<g transform="translate(536 292)">
 <ellipse cy="46" rx="48" ry="8" fill="#000" opacity=".3"/>
 <path d="M-43-27h23l8 8h29v50h-60Z" fill="#3c321e" stroke="#ad8b49"/>
 <path d="M-43-19h60l8 10-12 42h-64Z" fill="url(#oro)" stroke="#f2bd59" stroke-width="1.1"/>
 <path d="M-34-12H10M-36-6H-5" class="wire"/>
 <path d="M10-3v39c0 11 38 11 38 0V-3Z" fill="#252219" stroke="#9e8c65"/>
 <ellipse cx="29" cy="-3" rx="19" ry="7" fill="url(#superficie)" stroke="#f2bd59"/>
 <path d="M10 10c0 10 38 10 38 0M10 23c0 10 38 10 38 0" class="line"/>
 <path d="M17 7v26" stroke="#f2bd59" stroke-opacity=".6"/>
 <circle cx="39" cy="33" r="1.6" fill="#8cd4da"/>
 <text y="68" text-anchor="middle" class="label" style="letter-spacing:1px">FILE SYSTEM</text>
</g>
</svg>
